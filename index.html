<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./assets/logo.png" rel="icon">
    <link href="style.css" rel="stylesheet">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"

</head>

<body>
    <div class="main">
        <!-- 
        
        
        
                                                            Topbar 
         
        
        
-->
        <div class="topbar">
            <img id="btn_logo" src="./assets/logo.png" alt="logo">
            <div class="home_search">
                <img id="btn_home" src="./assets/home.svg" alt="home">
                <div id="home_search">
                    <img id="home_search_btn" src="./assets/search.svg" alt="search">

                    <div id="search_txt">
                        <input type="text"  name="search_txt" placeholder="What do you want to play?">
                    </div>

                    <img id="home_line" src="./assets/line.png" alt="line">

                    <img id="home_box" src="./assets/box.png" alt="box">
                </div>
            </div>





            <div class="group1">
                <a href="#" alt="install">
                    <img id="grp1_profile" src="./assets/profile.png" alt="profile">
                </a>

                <a href="#" alt="install">
                    <img src="./assets/team.png" alt="team">
                </a>

                <a href="#" alt="install">
                    <img src="./assets/notification.png" alt="notification">
                </a>

                <a id="grp1_install" href="#" alt="install">
                    <img src="./assets/download.png" alt="downlaod_button"> Install App
                </a>
                <a href="#" alt="install">
                    <div id="grp1_subscription">
                        Explore Premium
                    </div>
                </a>
            </div>
        </div>
        <!-- 
        



                                                                    Sidebar  
                                                                    
                                                                    
                                                                    
                                                                    
-->
        <div class="sidebar">sidebar</div>
        <div class="main_content">main content</div>
        <div class="music_player">Music Player</div>
    </div>

</body>

</html>
