<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./assets/logo.png" rel="icon">
    <link href="style.css" rel="stylesheet">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="main">
        <div class="sidebar">
            <div class="nav">
                <!-- 
                                                                            nav options under nav 
  -->
                <div class="nav-options">
                    <a href="#" style="opacity: 1;">
                        <img src="./assets/home.svg" alt="home">
                        Home
                    </a>
                </div>
                <div class="nav-options">
                    <a href="#">
                        <img src="./assets/search.svg" alt="search">
                        Search
                    </a>
                </div>
            </div>
            <!-- 
                                                                                library  under nav tag
  -->
            <div class="library">
                <div class="lib-option">
                    <div class="your-lib">
                        <a href="#">
                            <img src="./assets/library_icon.png" alt="librart">
                            Your Library
                        </a>
                    </div>
                    <div class="icon">
                        <img src="./assets/add.png" alt="add btn">
                        <img src="./assets/arrow-right.png" alt="right arrow">
                    </div>
                </div>
                <!--      
                                                                                  box 1
-->
                <div class="lib-box">
                    <div class="box-p1">
                        Create your first playlist
                    </div>
                    <div class="box-p2">
                        it's easy, We'll help you
                    </div>
                    <button type="button">Create Playlist</button>
                </div>
                <!--      
                                                                                  box 2
-->
                <div class="lib-box">
                    <div class="box-p1">
                        Let's find some podcasts to follow
                    </div>
                    <div class="box-p2">
                        we'll keep you updated on new episodes
                    </div>
                    <button type="button">Browse podcasts</button>
                </div>
            </div>
        </div>

        <!-- 
                                                                                        main content 
  -->
        <div class="maincontent">
            <div class="sticky-nav">
                <div class="sticky-nav-btn">
                    <img src="./assets/backward_icon.png" alt="backward_icon">
                    <img src="./assets/forward_icon.png" alt="forward_icon">
                </div>
                <div class="sticky-nav-download">
                    <button type="button" class="nav-btn1">Explore Premium</button>
                    <button type="button" class="nav-btn2">
                        <img src="./assets/download.png" alt="download">
                        Install App
                    </button>
                    <img src="./assets/profile.png" alt="profile">
                </div>
            </div>
            <div class="cards">

            </div>
        </div>
        <!-- 
                                                                                        Music Player 
-->

        <div class="musicplayer">Music Player</div>
    </div>
</body>

</html>
